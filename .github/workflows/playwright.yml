name: Playwright Tests

on:
  push:
    branches: [integration, main]
  pull_request:
    branches: [integration, main]
  schedule:
    - cron: '0 0 * * *'   # optional: nightly run

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Cache dependencies (faster builds 🚀)
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 6. Run tests (parallel by default)
      - name: Run Playwright Tests for QA
        run: npx playwright test
        env:
             ENV: qa

      # 7. Upload HTML report (VERY IMPORTANT 🔥)
      - name: Upload Playwright Report
        if: always() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 8. Upload test results (optional debugging)
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/